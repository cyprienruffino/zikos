# NOTE: the local (language: system) hooks below expect the project's
# virtualenv (.venv) to be activated and `npm ci` to have been run, so that
# `python`, `npm` and `npx` resolve to the project toolchain.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # black is the single formatter for this project (ruff is lint-only).
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      # The mirrors-prettier/mirrors-eslint hooks are gone: the ESLint 9
      # mirror cannot read the legacy .eslintrc.json config. Use the
      # project-local toolchain instead.
      - id: prettier
        name: prettier check
        entry: npx prettier --check "frontend/**/*.{ts,html,css}"
        language: system
        files: ^frontend/.*\.(ts|html|css)$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false
      - id: typescript-build
        name: typescript build
        entry: npm run build
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false
      - id: typescript-test
        name: typescript test
        entry: npm run test
        language: system
        files: ^(frontend/src/|tests/frontend/).*\.ts$
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit tests with coverage
        # `env` sets PYTHONPATH portably (pre-commit has no `env:` key for
        # language: system hooks). Coverage flags are passed explicitly here
        # (and in CI) rather than via pytest addopts.
        entry: env PYTHONPATH=backend python -m pytest
        args:
          [
            'tests/unit/',
            '-x',
            '--cov=backend/zikos',
            '--cov-config=pyproject.toml',
            '--cov-report=term-missing',
            '--cov-fail-under=79',
          ]
        language: system
        files: ^(backend/|tests/).*\.py$
        pass_filenames: false
