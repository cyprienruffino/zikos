services:
  zikos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zikos
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./audio_storage:/app/audio_storage
      - ./midi_storage:/app/midi_storage
      - ./notation_storage:/app/notation_storage
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - LLM_MODEL_PATH=/app/models/${LLM_MODEL_FILE:-Phi-3-mini-4k-instruct-q4.gguf}
      # LLM_N_CTX intentionally unset: auto-detected from the model.
      # (The old hardcoded 32768 was 8x the default Phi-3-mini-4k context.)
      - LLM_N_GPU_LAYERS=0
      - LLM_TEMPERATURE=0.7
      - LLM_TOP_P=0.9
      - AUDIO_STORAGE_PATH=/app/audio_storage
      - MIDI_STORAGE_PATH=/app/midi_storage
      - NOTATION_STORAGE_PATH=/app/notation_storage
    restart: unless-stopped
